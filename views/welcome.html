<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>La Rifa Ganadora</title>
  <meta name="theme-color" content="#0b0b14" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="stylesheet" href="/css/theme.css" />
</head>
<body>
  <canvas id="particles-canvas"></canvas>

  <main class="welcome-screen">
    <div class="logo-badge">🎟️</div>
    <span class="platform-name" id="platform-name">La Rifa Ganadora</span>
    <h1 class="welcome-title" id="welcome-title">BIENVENIDO A LA RIFA GANADORA</h1>
    <p class="welcome-subtitle" id="welcome-subtitle">¡Prepárate para ganar!</p>

    <button class="btn-primary" id="go-button">IR A RIFAR</button>

    <button class="btn-primary" id="install-button" hidden style="background: linear-gradient(90deg, var(--color-secondary), var(--color-accent)); font-size: 14px; padding: 10px 22px;">
      📲 Instalar aplicación
    </button>

    <p class="install-hint">Puedes instalar esta plataforma como aplicación en tu celular, tablet o computador.</p>
  </main>

  <script src="/js/particles.js"></script>
  <script src="/js/welcome.js"></script>
</body>
</html>
